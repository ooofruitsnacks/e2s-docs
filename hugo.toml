baseURL = "https://e2s.app/"
title = "Free. Open-source. Forever."
languageCode = "en-us"
defaultContentLanguage = "en"
defaultContentLanguageInSubdir = false

theme = "liftoff"
enableRobotsTXT = true

[params]
  description = "E2S Assistant - Privacy Policy and Documentation."
  tagline = "Personal Assistant For The Blind, Low Vision, and Disabled."
  accent = "cyan"

[menus]
  [[menus.main]]
    name = "Home"
    pageRef = "/"
    weight = 10

  [[menus.main]]
    name = "Privacy Policy"
    pageRef = "/privacy-policy"
    weight = 20

  [[menus.main]]
    name = "Documentation"
    pageRef = "/documentation"
    weight = 20

[markup]
  [markup.highlight]
    style = "github-dark"
    noClasses = false
    lineNos = false
    codeFences = true
    tabWidth = 3
