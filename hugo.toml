baseURL = "https://e2s.app/"
title = "E2S Assistant"
languageCode = "en-us"
defaultContentLanguage = "en"
defaultContentLanguageInSubdir = false

theme = "liftoff"
enableRobotsTXT = true

[params]
  description = "E2S Assistant - Documentation."
  tagline = "Personal Assistant For The Blind, Low Vision, and Disabled."
  accent = "cyan"

[menus]
  [[menus.main]]
    name = "Home"
    pageRef = "/"
    weight = 10

  [[menus.main]]
    name = "Privacy Policy"
    pageRef = "/privacy-policy"
    weight = 20

  [[menus.main]]
    name = "Terms of Service"
    pageRef = "/terms-of-service"
    weight = 20

  [[menus.main]]
    name = "Terms of Use"
    pageRef = "/terms-of-use"
    weight = 20

  [[menus.main]]
    name = "Documentation"
    pageRef = "/documentation"
    weight = 20

  [[menus.main]]
    name = "Features"
    pageRef = "/features"
    weight = 20

  [[menus.main]]
    name = "Getting Started"
    pageRef = "/getting-started"
    weight = 20

[markup]
  [markup.highlight]
    style = "github-dark"
    noClasses = false
    lineNos = false
    codeFences = true
    tabWidth = 3
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
    [markup.goldmark.parser]
      autoHeadingID = true
      [markup.goldmark.parser.attribute]
        title = true
        block = true
