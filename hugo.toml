baseURL = "https://e2s.app/"
title = "E2S Assistant"
languageCode = "en-us"
defaultContentLanguage = "en"
defaultContentLanguageInSubdir = false

theme = "liftoff"
enableRobotsTXT = true

[params]
  description = "Privacy policy and documentation for E2S Assistant."
  tagline = "Assistant for the blind, low vision, and disabled."
  accent = "cyan"

[menus]
  [[menus.main]]
    name = "Home"
    pageRef = "/"
    weight = 10

  [[menus.main]]
    name = "Privacy Policy"
    pageRef = "/privacy-policy"
    weight = 20

[markup]
  [markup.highlight]
    style = "github-dark"
    noClasses = false
    lineNos = false
    codeFences = true
    tabWidth = 2
